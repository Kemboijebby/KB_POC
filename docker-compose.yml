version: '3.8'

services:
  postgres:
    image: postgres:18
    container_name: kcbv2
    restart: unless-stopped
    environment:
      POSTGRES_DB: kcb_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin01
    ports:
      - "5432:5432"
    command: >
      postgres 
      -c wal_level=logical 
      -c max_wal_senders=10 
      -c max_replication_slots=10
    volumes:
      - kcb_postgres_v2:/var/lib/postgresql/data
    networks:
      - data-pipeline

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kcb_kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:29092'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    networks:
      - data-pipeline

  debezium:
    image: debezium/connect:2.5
    container_name: kcb_debezium
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: kcb_connect_configs
      OFFSET_STORAGE_TOPIC: kcb_connect_offsets
      STATUS_STORAGE_TOPIC: kcb_connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      ENABLE_DEBEZIUM_SCRIPTING: "false"
    depends_on:
      - kafka
      - postgres
    networks:
      - data-pipeline
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: kcb_clickhouse
    restart: unless-stopped
    ports:
      - "8123:8123"   
      - "9000:9000"   
    environment:
      CLICKHOUSE_DB: kcb_analytics
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: admin01
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - data-pipeline

  airflow:
    build: .
    container_name: kcb_airflow
    restart: always
    command: standalone
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://postgres:admin01@kcbv2:5432/airflow_db
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__WEBSERVER__SECRET_KEY=kcb_secret_analytics_key_2026
      - AIRFLOW__CORE__FERNET_KEY=46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLbfzqBpGw=
      - AIRFLOW__WEBSERVER__BASE_URL=http://localhost:8081
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./kcb_dbt:/opt/airflow/kcb_dbt
      - C:/Users/Administrator/.dbt:/home/airflow/.dbt
    ports:
      - "8081:8080"
    networks:
      - data-pipeline
    user: "${AIRFLOW_UID:-50000}:0"
  grafana:
    image: grafana/grafana:latest
    container_name: kcb_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-clickhouse-datasource
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - data-pipeline

volumes:
  kcb_postgres_v2:
  grafana_data:

networks:
  data-pipeline:
    name: data-pipeline
    external: true

 